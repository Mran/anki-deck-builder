<div class="ak ak-mcq" data-side="back">
  <div class="ak-kind">[[t:kind_mcq]]</div>
  <div class="ak-q">{{Question}}</div>
  <div class="ak-opts" id="answer"></div>
  <div class="ak-verdict"></div>
  {{#Explanation}}<div class="ak-extra"><span class="ak-extra-label">[[t:explanation]]</span>{{Explanation}}</div>{{/Explanation}}
  {{#Source}}<div class="ak-source">{{Source}}</div>{{/Source}}
  <div class="ak-data" style="display:none">
    <div class="ak-raw-opts">{{Options}}</div>
    <div class="ak-raw-ans">{{text:Answer}}</div>
    <div class="ak-raw-shuffle">{{text:Shuffle}}</div>
  </div>
</div>
<script>[[include:mcq.js]]</script>
